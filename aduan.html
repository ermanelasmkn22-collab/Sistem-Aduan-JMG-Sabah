<script>
/* =====================================================
   SISTEM ADUAN JMG SABAH
   VERSI SEMENTARA - TANPA GOOGLE SHEET
   DATA DISIMPAN DALAM LOCAL STORAGE
   ===================================================== */

const STORAGE_KEY = "JMG_ADUAN_SABAH";


/* =====================================================
   BORANG HANTAR ADUAN
   ===================================================== */

document.getElementById("aduanForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const button =
        document.querySelector("#aduanForm button");

    const nama =
        document.getElementById("nama").value.trim();

    const jawatan =
        document.getElementById("jawatan").value.trim();

    const bahagian =
        document.getElementById("bahagian").value.trim();

    const blok =
        document.getElementById("blok").value.trim();

    const tingkat =
        document.getElementById("tingkat").value.trim();

    const lokasi =
        document.getElementById("lokasi").value.trim();

    const jenis =
        document.getElementById("jenis").value;

    const penerangan =
        document.getElementById("penerangan").value.trim();

    const cadangan =
        document.getElementById("cadangan").value.trim();

    const tarikh =
        document.getElementById("tarikh").value;

    const gambarInput =
        document.getElementById("gambar");


    button.disabled = true;
    button.innerText = "⏳ Menyimpan Aduan...";


    /* =================================================
       SIMPAN ADUAN
       ================================================= */

    function simpanAduan(gambarBase64) {

        try {

            let semuaAduan =
                JSON.parse(
                    localStorage.getItem(STORAGE_KEY) || "[]"
                );


            /* -----------------------------------------
               JANA NO ADUAN
               ----------------------------------------- */

            let nombor = 1;

            semuaAduan.forEach(function(item) {

                const match =
                    String(item.noAduan || "")
                    .match(/(\d+)$/);

                if (match) {

                    const n =
                        parseInt(match[1], 10);

                    if (n >= nombor) {
                        nombor = n + 1;
                    }
                }

            });


            const noAduan =
                "FAC-" +
                String(nombor).padStart(4, "0");


            /* -----------------------------------------
               TARIKH & MASA
               ----------------------------------------- */

            const sekarang =
                new Date();


            const masa =
                sekarang.toLocaleTimeString(
                    "ms-MY",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            /* -----------------------------------------
               DATA ADUAN
               ----------------------------------------- */

            const aduan = {

                id: Date.now(),

                noAduan: noAduan,

                tarikh: tarikh,

                masa: masa,

                nama: nama,

                jawatan: jawatan,

                bahagian: bahagian,

                blok: blok,

                tingkat: tingkat,

                lokasi: lokasi,

                jenis: jenis,

                jenisKerosakan: jenis,

                penerangan: penerangan,

                cadangan: cadangan,

                gambar: gambarBase64 || "",

                status: "Baharu",

                catatan: "",

                catatanPPT: "",

                timestamp: Date.now()
            };


            /* -----------------------------------------
               MASUKKAN KE SENARAI
               ----------------------------------------- */

            semuaAduan.push(aduan);


            /* -----------------------------------------
               SIMPAN
               ----------------------------------------- */

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(semuaAduan)
            );


            console.log(
                "ADUAN BERJAYA DISIMPAN:",
                aduan
            );


            console.log(
                "JUMLAH ADUAN:",
                semuaAduan.length
            );


            /* -----------------------------------------
               PAPAR BERJAYA
               ----------------------------------------- */

            paparBerjaya(noAduan);

        }

        catch(error) {

            console.error(
                "RALAT SIMPAN:",
                error
            );

            alert(
                "❌ Aduan gagal disimpan.\n\n" +
                "Jika ada gambar, cuba gambar yang lebih kecil."
            );

            button.disabled = false;

            button.innerText =
                "📤 Hantar Aduan";
        }
    }


    /* =================================================
       GAMBAR
       ================================================= */

    if (
        gambarInput.files &&
        gambarInput.files.length > 0
    ) {

        const file =
            gambarInput.files[0];


        /* maksimum 10MB */

        if (
            file.size >
            10 * 1024 * 1024
        ) {

            alert(
                "❌ Saiz gambar terlalu besar.\n" +
                "Sila pilih gambar kurang daripada 10MB."
            );

            button.disabled = false;

            button.innerText =
                "📤 Hantar Aduan";

            return;
        }


        compressImage(file)

            .then(function(gambarBase64) {

                simpanAduan(
                    gambarBase64
                );

            })

            .catch(function(error) {

                console.error(
                    error
                );

                alert(
                    "❌ Gambar tidak dapat diproses."
                );

                button.disabled = false;

                button.innerText =
                    "📤 Hantar Aduan";
            });

    }

    else {

        /* TIADA GAMBAR */

        simpanAduan("");
    }

});


/* =====================================================
   COMPRESS GAMBAR
   ===================================================== */

function compressImage(file) {

    return new Promise(function(resolve, reject) {

        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                const img =
                    new Image();


                img.onload =
                    function() {

                        const maxWidth =
                            900;

                        const maxHeight =
                            900;


                        let width =
                            img.width;

                        let height =
                            img.height;


                        if (
                            width > maxWidth ||
                            height > maxHeight
                        ) {

                            const ratio =
                                Math.min(
                                    maxWidth / width,
                                    maxHeight / height
                                );


                            width =
                                Math.round(
                                    width * ratio
                                );


                            height =
                                Math.round(
                                    height * ratio
                                );
                        }


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        const ctx =
                            canvas.getContext(
                                "2d"
                            );


                        ctx.drawImage(
                            img,
                            0,
                            0,
                            width,
                            height
                        );


                        const gambar =
                            canvas.toDataURL(
                                "image/jpeg",
                                0.65
                            );


                        resolve(gambar);
                    };


                img.onerror =
                    function() {

                        reject(
                            new Error(
                                "Gambar tidak dapat dibaca."
                            )
                        );
                    };


                img.src =
                    event.target.result;
            };


        reader.onerror =
            function() {

                reject(
                    new Error(
                        "Gagal membaca gambar."
                    )
                );
            };


        reader.readAsDataURL(file);

    });
}


/* =====================================================
   PAPAR BERJAYA
   ===================================================== */

function paparBerjaya(noAduan) {

    document
        .querySelector(".container")
        .innerHTML = `

        <div style="
            text-align:center;
            padding:50px 20px;
        ">

            <div style="
                font-size:65px;
                margin-bottom:20px;
            ">
                ✅
            </div>


            <h2 style="
                color:#1f5d3a;
                margin-bottom:15px;
            ">
                Aduan Berjaya Dihantar
            </h2>


            <p style="
                color:#666;
                line-height:1.6;
                margin-bottom:15px;
            ">
                Aduan kerosakan anda telah berjaya
                direkodkan dalam sistem.
            </p>


            <div style="
                background:#f0f7f3;
                border-radius:10px;
                padding:20px;
                margin:20px auto 30px;
                max-width:400px;
            ">

                <div style="
                    color:#666;
                    font-size:14px;
                    margin-bottom:5px;
                ">
                    NO. ADUAN
                </div>


                <div style="
                    color:#1f5d3a;
                    font-size:30px;
                    font-weight:bold;
                ">
                    ${noAduan}
                </div>

            </div>


            <p style="
                color:#777;
                font-size:14px;
                line-height:1.6;
                margin-bottom:30px;
            ">
                Aduan telah disimpan dan boleh
                dilihat oleh pihak PPT.
            </p>


            <div style="
                display:flex;
                gap:12px;
                justify-content:center;
                flex-wrap:wrap;
            ">


                <button
                    type="button"
                    class="success-button"
                    onclick="
                        window.location.href='index.html'
                    "
                >
                    🏠 Kembali ke Halaman Utama
                </button>


                <button
                    type="button"
                    class="success-button new-button"
                    onclick="
                        window.location.href='aduan.html'
                    "
                >
                    ↩️ Buat Aduan Baharu
                </button>


            </div>

        </div>

    `;
}
</script>
