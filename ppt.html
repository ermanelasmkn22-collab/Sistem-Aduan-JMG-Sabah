<script>
/* =====================================================
   SISTEM PENGURUSAN ADUAN JMG SABAH
   VERSI SEMENTARA TANPA GOOGLE SHEET
   ===================================================== */

const STORAGE_KEY = "JMG_ADUAN_SABAH";

let semuaAduan = [];
let tabSemasa = "aktif";


/* =====================================================
   AMBIL DATA
   ===================================================== */

function dapatkanAduan() {

    try {

        const data = localStorage.getItem(STORAGE_KEY);

        semuaAduan = data ? JSON.parse(data) : [];

        /* Pastikan array */
        if (!Array.isArray(semuaAduan)) {
            semuaAduan = [];
        }

        /* Pastikan ID dan nama field betul */
        semuaAduan.forEach(function(aduan, index) {

            if (!aduan.id) {
                aduan.id = Date.now() + index;
            }

            if (!aduan.jenis && aduan.jenisKerosakan) {
                aduan.jenis = aduan.jenisKerosakan;
            }

            if (!aduan.catatan && aduan.catatanPPT) {
                aduan.catatan = aduan.catatanPPT;
            }

        });

        /* Simpan semula jika ada ID baru */
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(semuaAduan)
        );

        console.log(
            "DATA ADUAN:",
            semuaAduan
        );

        kemaskiniDashboard();
        paparAduan();

    } catch (error) {

        console.error(
            "Ralat membaca aduan:",
            error
        );

        semuaAduan = [];

        paparError(
            "❌ Gagal membaca data aduan."
        );
    }
}


/* =====================================================
   LOADING
   ===================================================== */

function paparLoading() {

    document.getElementById(
        "aduanTable"
    ).innerHTML = `

        <tr>

            <td colspan="8">

                <div class="loading">
                    ⏳ Memuatkan aduan...
                </div>

            </td>

        </tr>

    `;
}


/* =====================================================
   ERROR
   ===================================================== */

function paparError(message) {

    document.getElementById(
        "aduanTable"
    ).innerHTML = `

        <tr>

            <td colspan="8">

                <div class="error">
                    ${escapeHTML(message)}
                </div>

            </td>

        </tr>

    `;
}


/* =====================================================
   DASHBOARD
   ===================================================== */

function kemaskiniDashboard() {

    const jumlahAktif =
        semuaAduan.filter(function(aduan) {

            return String(
                aduan.status || "Baharu"
            ).toLowerCase() !== "selesai";

        }).length;


    const dalamTindakan =
        semuaAduan.filter(function(aduan) {

            return String(
                aduan.status || "Baharu"
            ).toLowerCase() ===
            "dalam tindakan";

        }).length;


    const selesai =
        semuaAduan.filter(function(aduan) {

            return String(
                aduan.status || "Baharu"
            ).toLowerCase() ===
            "selesai";

        }).length;


    document.getElementById(
        "jumlahAduan"
    ).textContent = jumlahAktif;


    document.getElementById(
        "dalamTindakan"
    ).textContent = dalamTindakan;


    document.getElementById(
        "aduanSelesai"
    ).textContent = selesai;
}


/* =====================================================
   TAB
   ===================================================== */

function tukarTab(tab) {

    tabSemasa = tab;


    document
        .getElementById("tabAktif")
        .classList.remove("active");


    document
        .getElementById("tabSelesai")
        .classList.remove("active");


    if (tab === "aktif") {

        document
            .getElementById("tabAktif")
            .classList.add("active");


        document
            .getElementById("tajukSenarai")
            .textContent =
            "Senarai Aduan Kerosakan";


        document
            .getElementById("notaSejarah")
            .style.display = "none";


        document
            .getElementById("statusFilter")
            .innerHTML = `

                <option value="Semua">
                    Semua Status
                </option>

                <option value="Baharu">
                    Baharu
                </option>

                <option value="Dalam Tindakan">
                    Dalam Tindakan
                </option>

            `;

    } else {

        document
            .getElementById("tabSelesai")
            .classList.add("active");


        document
            .getElementById("tajukSenarai")
            .textContent =
            "Rekod Aduan Lepas / Selesai";


        document
            .getElementById("notaSejarah")
            .style.display = "block";


        document
            .getElementById("statusFilter")
            .innerHTML = `

                <option value="Selesai">
                    Selesai
                </option>

            `;
    }


    paparAduan();
}


/* =====================================================
   PAPAR SENARAI ADUAN
   ===================================================== */

function paparAduan() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const statusFilter =
        document
            .getElementById("statusFilter")
            .value;


    const table =
        document.getElementById(
            "aduanTable"
        );


    table.innerHTML = "";


    const ditapis =
        semuaAduan.filter(function(aduan) {

            const status =
                String(
                    aduan.status || "Baharu"
                ).trim();


            /* AKTIF */
            if (
                tabSemasa === "aktif" &&
                status === "Selesai"
            ) {
                return false;
            }


            /* SELESAI */
            if (
                tabSemasa === "selesai" &&
                status !== "Selesai"
            ) {
                return false;
            }


            const nama =
                String(
                    aduan.nama || ""
                ).toLowerCase();


            const lokasi =
                String(
                    aduan.lokasi || ""
                ).toLowerCase();


            const noAduan =
                String(
                    aduan.noAduan || ""
                ).toLowerCase();


            const carian =
                nama.includes(search) ||
                lokasi.includes(search) ||
                noAduan.includes(search);


            let statusOK = true;


            if (
                tabSemasa === "aktif" &&
                statusFilter !== "Semua"
            ) {

                statusOK =
                    status === statusFilter;
            }


            return carian && statusOK;

        });


    /* TIADA DATA */

    if (ditapis.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    style="
                        text-align:center;
                        color:#777;
                        padding:30px;
                    "
                >

                    ${
                        tabSemasa === "aktif"
                        ? "Tiada aduan aktif."
                        : "Tiada rekod aduan selesai."
                    }

                </td>

            </tr>

        `;

        return;
    }


    /* PAPAR DATA */

    ditapis.forEach(function(aduan, index) {

        let statusClass = "baru";


        if (
            aduan.status ===
            "Dalam Tindakan"
        ) {

            statusClass = "tindakan";
        }


        if (
            aduan.status ===
            "Selesai"
        ) {

            statusClass = "selesai";
        }


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>


            <td>

                <strong>
                    ${escapeHTML(
                        aduan.noAduan || "-"
                    )}
                </strong>

            </td>


            <td>
                ${escapeHTML(
                    aduan.nama || "-"
                )}
            </td>


            <td>
                ${escapeHTML(
                    aduan.lokasi || "-"
                )}
            </td>


            <td>
                ${escapeHTML(
                    aduan.jenis ||
                    aduan.jenisKerosakan ||
                    "-"
                )}
            </td>


            <td>
                ${formatTarikh(
                    aduan.tarikh
                )}
            </td>


            <td>

                <span
                    class="status ${statusClass}"
                >
                    ${escapeHTML(
                        aduan.status ||
                        "Baharu"
                    )}
                </span>

            </td>


            <td>

                <button
                    class="btn"
                    onclick="lihatAduan('${aduan.id}')"
                >
                    Lihat
                </button>

            </td>

        `;


        table.appendChild(row);

    });
}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   FORMAT TARIKH
   ===================================================== */

function formatTarikh(tarikh) {

    if (!tarikh) {
        return "-";
    }


    const d =
        new Date(tarikh);


    if (!isNaN(d.getTime())) {

        return d.toLocaleDateString(
            "ms-MY",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );
    }


    return String(tarikh);
}


/* =====================================================
   CARI ADUAN
   ===================================================== */

function cariAduan(id) {

    return semuaAduan.find(
        function(item) {

            return String(item.id) ===
                   String(id);

        }
    );
}


/* =====================================================
   LIHAT ADUAN
   ===================================================== */

function lihatAduan(id) {

    const aduan =
        cariAduan(id);


    if (!aduan) {

        alert(
            "Aduan tidak dijumpai."
        );

        return;
    }


    let kawalanStatus = "";


    if (
        aduan.status !==
        "Selesai"
    ) {

        kawalanStatus = `

            <div class="status-box">

                <label>
                    Status Aduan
                </label>


                <select id="statusAduan">

                    <option value="Baharu"
                        ${
                            aduan.status === "Baharu"
                            ? "selected"
                            : ""
                        }
                    >
                        Baharu
                    </option>


                    <option value="Dalam Tindakan"
                        ${
                            aduan.status ===
                            "Dalam Tindakan"
                            ? "selected"
                            : ""
                        }
                    >
                        Dalam Tindakan
                    </option>


                    <option value="Selesai"
                        ${
                            aduan.status ===
                            "Selesai"
                            ? "selected"
                            : ""
                        }
                    >
                        Selesai
                    </option>

                </select>


                <label
                    style="margin-top:15px;"
                >
                    Catatan PPT
                </label>


                <textarea
                    id="catatanPPT"
                    placeholder="Masukkan catatan / tindakan yang telah dibuat..."
                >${escapeHTML(
                    aduan.catatan ||
                    aduan.catatanPPT ||
                    ""
                )}</textarea>


                <button
                    class="full-btn save-btn"
                    onclick="kemaskiniStatus('${aduan.id}')"
                >
                    💾 Simpan Status & Catatan
                </button>

            </div>

        `;
    }


    document.getElementById(
        "detailContent"
    ).innerHTML = `

        <div class="detail">
            <strong>No. Aduan</strong>
            ${escapeHTML(
                aduan.noAduan || "-"
            )}
        </div>


        <div class="detail">
            <strong>Nama Pelapor</strong>
            ${escapeHTML(
                aduan.nama || "-"
            )}
        </div>


        <div class="detail">
            <strong>Jawatan</strong>
            ${escapeHTML(
                aduan.jawatan || "-"
            )}
        </div>


        <div class="detail">
            <strong>Bahagian / Unit</strong>
            ${escapeHTML(
                aduan.bahagian || "-"
            )}
        </div>


        <div class="detail">
            <strong>Blok / Lantai</strong>
            ${escapeHTML(
                aduan.blok || "-"
            )}
        </div>


        <div class="detail">
            <strong>Tingkat / Aras</strong>
            ${escapeHTML(
                aduan.tingkat || "-"
            )}
        </div>


        <div class="detail">
            <strong>Lokasi Kerosakan</strong>
            ${escapeHTML(
                aduan.lokasi || "-"
            )}
        </div>


        <div class="detail">
            <strong>Jenis Kerosakan</strong>
            ${escapeHTML(
                aduan.jenis ||
                aduan.jenisKerosakan ||
                "-"
            )}
        </div>


        <div class="detail">
            <strong>Penerangan Kerosakan</strong>
            ${escapeHTML(
                aduan.penerangan || "-"
            )}
        </div>


        <div class="detail">
            <strong>Cadangan Penambahbaikan</strong>
            ${escapeHTML(
                aduan.cadangan || "-"
            )}
        </div>


        <div class="detail">
            <strong>Tarikh Aduan</strong>
            ${formatTarikh(
                aduan.tarikh
            )}
        </div>


        <div class="detail">
            <strong>Masa Aduan</strong>
            ${escapeHTML(
                aduan.masa || "-"
            )}
        </div>


        <div class="detail">
            <strong>Status</strong>
            ${escapeHTML(
                aduan.status ||
                "Baharu"
            )}
        </div>


        ${
            aduan.gambar
            ?

            `

            <div class="detail">

                <strong>
                    🖼️ Gambar Kerosakan
                </strong>


                <img
                    src="${aduan.gambar}"
                    class="detail-image"
                    alt="Gambar Kerosakan"
                >


                <br><br>


                <a
                    href="${aduan.gambar}"
                    target="_blank"
                    class="btn"
                >
                    🖼️ Buka Gambar
                </a>

            </div>

            `

            :

            `

            <div class="detail">

                <strong>
                    🖼️ Gambar Kerosakan
                </strong>

                Tiada gambar dilampirkan.

            </div>

            `
        }


        ${kawalanStatus}


        <button
            class="full-btn pdf-btn"
            onclick="janaPDF('${aduan.id}')"
        >
            📄 Jana PDF Aduan
        </button>

    `;


    document.getElementById(
        "detailModal"
    ).style.display = "flex";
}


/* =====================================================
   KEMASKINI STATUS
   ===================================================== */

function kemaskiniStatus(id) {

    const aduan =
        cariAduan(id);


    if (!aduan) {
        return;
    }


    const statusElement =
        document.getElementById(
            "statusAduan"
        );


    const catatanElement =
        document.getElementById(
            "catatanPPT"
        );


    if (!statusElement) {
        return;
    }


    aduan.status =
        statusElement.value;


    aduan.catatan =
        catatanElement
        ? catatanElement.value.trim()
        : "";


    aduan.catatanPPT =
        aduan.catatan;


    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                semuaAduan
            )
        );


        console.log(
            "STATUS DIKEMASKINI:",
            aduan
        );


        tutupModal();


        kemaskiniDashboard();


        paparAduan();


        alert(
            "✅ Status dan catatan berjaya disimpan."
        );

    }

    catch(error) {

        console.error(
            error
        );

        alert(
            "❌ Gagal menyimpan perubahan."
        );
    }
}


/* =====================================================
   TUTUP MODAL
   ===================================================== */

function tutupModal() {

    document.getElementById(
        "detailModal"
    ).style.display = "none";
}


/* =====================================================
   KLIK LUAR MODAL
   ===================================================== */

window.onclick =
function(event) {

    const modal =
        document.getElementById(
            "detailModal"
        );


    if (
        event.target === modal
    ) {

        tutupModal();
    }
};


/* =====================================================
   JANA PDF
   ===================================================== */

function janaPDF(id) {

    const aduan =
        cariAduan(id);


    if (!aduan) {

        alert(
            "Aduan tidak dijumpai."
        );

        return;
    }


    const {
        jsPDF
    } = window.jspdf;


    const doc =
        new jsPDF();


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.setFontSize(17);


    doc.text(
        "JABATAN MINERAL DAN GEOSAINS MALAYSIA",
        20,
        20
    );


    doc.setFontSize(13);


    doc.text(
        "SABAH",
        20,
        28
    );


    doc.line(
        20,
        34,
        190,
        34
    );


    doc.setFontSize(15);


    doc.text(
        "BORANG ADUAN KEROSAKAN FASILITI",
        20,
        46
    );


    let y = 60;


    function tambah(
        label,
        value
    ) {

        doc.setFontSize(10);


        doc.setFont(
            "helvetica",
            "bold"
        );


        doc.text(
            label,
            20,
            y
        );


        doc.setFont(
            "helvetica",
            "normal"
        );


        const lines =
            doc.splitTextToSize(
                String(value || "-"),
                120
            );


        doc.text(
            lines,
            65,
            y
        );


        y += Math.max(
            8,
            lines.length * 6
        );


        if (y > 270) {

            doc.addPage();

            y = 20;
        }
    }


    tambah(
        "No. Aduan:",
        aduan.noAduan
    );


    tambah(
        "Nama Pelapor:",
        aduan.nama
    );


    tambah(
        "Jawatan:",
        aduan.jawatan
    );


    tambah(
        "Bahagian / Unit:",
        aduan.bahagian
    );


    tambah(
        "Blok / Lantai:",
        aduan.blok
    );


    tambah(
        "Tingkat / Aras:",
        aduan.tingkat
    );


    tambah(
        "Lokasi:",
        aduan.lokasi
    );


    tambah(
        "Jenis Kerosakan:",
        aduan.jenis ||
        aduan.jenisKerosakan
    );


    tambah(
        "Penerangan:",
        aduan.penerangan
    );


    tambah(
        "Cadangan:",
        aduan.cadangan
    );


    tambah(
        "Tarikh Aduan:",
        formatTarikh(
            aduan.tarikh
        )
    );


    tambah(
        "Masa Aduan:",
        aduan.masa
    );


    tambah(
        "Status:",
        aduan.status
    );


    tambah(
        "Catatan PPT:",
        aduan.catatan ||
        aduan.catatanPPT
    );


    /* GAMBAR */

    if (aduan.gambar) {

        if (y > 180) {

            doc.addPage();

            y = 20;
        }


        doc.setFont(
            "helvetica",
            "bold"
        );


        doc.text(
            "Gambar Kerosakan:",
            20,
            y
        );


        y += 8;


        try {

            doc.addImage(
                aduan.gambar,
                "JPEG",
                20,
                y,
                100,
                75
            );

        }

        catch(error) {

            console.error(
                "Gambar gagal dimasukkan ke PDF:",
                error
            );
        }
    }


    doc.save(
        "Aduan-" +
        (
            aduan.noAduan ||
            "JMG"
        ) +
        ".pdf"
    );
}


/* =====================================================
   CARIAN
   ===================================================== */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        paparAduan
    );


document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        paparAduan
    );


/* =====================================================
   MULA SISTEM
   ===================================================== */

window.addEventListener(
    "load",
    function() {

        dapatkanAduan();

    }
);


/*
 * Auto refresh setiap 3 saat
 * supaya perubahan localStorage dapat dibaca
 * apabila halaman yang sama digunakan.
 */

setInterval(
    dapatkanAduan,
    3000
);

</script>
