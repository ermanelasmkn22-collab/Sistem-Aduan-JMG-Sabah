<style>

/* =====================================================
   RESET

/* =====================================================

body{

/* =====================================================
   HEADER
===================================================== */

.header{
    background:linear-gradient(
        135deg,
        #123c69,
        #1769aa
    );

    color:white;

    padding:20px 30px;

    display:flex;

    justify-content:space-between;

.header-left h1{

.header-right{

/* =====================================================

.search{

.select{

    border:
        1px solid #d1d5db;

}


/* =====================================================
   TABLE
===================================================== */

.table-container{

    background:white;

    border-radius:14px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.08);

    overflow:hidden;
}


.table-header{

    padding:20px;

    border-bottom:
        1px solid #e5e7eb;
}


.table-header h2{

    font-size:19px;
}


.table-header p{

.table-wrap{

table{

thead{

th{

td{

tbody tr:hover{

/* =====================================================
   STATUS

.status{

/* =====================================================

.btn-primary{

.btn-success{

/* =====================================================

.modal{

/* =====================================================

.detail-grid{

.detail-item{

.image-box{

.update-box{

/* =====================================================
   EMPTY
===================================================== */

.empty{

/* =====================================================

.toast{

}


.toast.show{

        translateY(0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:800px){

    .dashboard{

        grid-template-columns:1fr;

    }

    }

        grid-template-columns:1fr;
    }

}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>



<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAQmAhXDBfk2W05iMG4xIZQ6HYKrFKIZXg",

    authDomain:
        "sistem-aduan-jmg-sabah.firebaseapp.com",

    projectId:
        "sistem-aduan-jmg-sabah",

    storageBucket:
        "sistem-aduan-jmg-sabah.firebasestorage.app",

    messagingSenderId:
        "396264308079",

    appId:
        "1:396264308079:web:f478c52097bd1fa592fc9a",

    measurementId:
        "G-4K74PF0M7S"
};



/* =====================================================
   START FIREBASE
===================================================== */

firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


const auth =
    firebase.auth();



/* =====================================================
   VARIABLES
===================================================== */

let semuaAduan = [];

let tabSemasa = "aktif";

let aduanSemasa = null;

let hentikanListener = null;



/* =====================================================
   TARIKH
===================================================== */

function paparkanTarikh(){

    const sekarang =
        new Date();


    const pilihan = {

        day:"2-digit",

        month:"2-digit",

        year:"numeric",

        hour:"2-digit",

        minute:"2-digit"

    };


    document
        .getElementById(
            "tarikhSemasa"
        )
        .textContent =
        sekarang.toLocaleString(
            "ms-MY",
            pilihan
        );

}


/* =====================================================
   BACA FIRESTORE REALTIME
===================================================== */

function mulaDengarAduan(){

    if(hentikanListener){

        hentikanListener();

    }


    hentikanListener =

        db

        .collection("aduan")

        .onSnapshot(

            function(snapshot){

                semuaAduan =
                    snapshot.docs.map(
                        function(doc){

                            const data =
                                doc.data() || {};


                            let timestamp = 0;


                            if(
                                data.timestamp &&
                                typeof data.timestamp.toMillis ===
                                "function"
                            ){

                                timestamp =
                                    data.timestamp.toMillis();

                            }


                            else if(
                                data.timestamp
                            ){

                                timestamp =
                                    Number(
                                        data.timestamp
                                    ) || 0;

                            }


                            return {

                                ...data,

                                id:
                                    doc.id,

                                timestamp:
                                    timestamp,

                                status:
                                    data.status ||
                                    "Baharu",

                                jenis:
                                    data.jenis ||
                                    data.jenisKerosakan ||
                                    "",

                                catatan:
                                    data.catatan ||
                                    data.catatanPPT ||
                                    ""

                            };

                        }
                    );


                kemaskiniDashboard();

                paparAduan();


                console.log(
                    "Firebase:",
                    semuaAduan
                );

            },


            function(error){

                console.error(
                    "Firestore Error:",
                    error
                );


                alert(
                    "❌ Gagal membaca data aduan Firebase.\n\n" +
                    "Semak Firestore Rules."
                );

            }

        );

}



/* =====================================================
   DASHBOARD
===================================================== */

function kemaskiniDashboard(){

    const jumlahAktif =
        semuaAduan.filter(
            function(a){

                return String(
                    a.status ||
                    "Baharu"
                ).toLowerCase()
                !==
                "selesai";

            }
        ).length;


    const tindakan =
        semuaAduan.filter(
            function(a){

                return String(
                    a.status ||
                    ""
                ).toLowerCase()
                ===
                "dalam tindakan";

            }
        ).length;


    const selesai =
        semuaAduan.filter(
            function(a){

                return String(
                    a.status ||
                    ""
                ).toLowerCase()
                ===
                "selesai";

            }
        ).length;


    document
        .getElementById(
            "jumlahAduan"
        )
        .textContent =
        jumlahAktif;


    document
        .getElementById(
            "dalamTindakan"
        )
        .textContent =
        tindakan;


    document
        .getElementById(
            "aduanSelesai"
        )
        .textContent =
        selesai;

}



/* =====================================================
   TUKAR TAB
===================================================== */

function tukarTab(tab){

    tabSemasa =
        tab;


    document
        .getElementById(
            "tabAktif"
        )
        .classList
        .toggle(
            "active",
            tab === "aktif"
        );


    document
        .getElementById(
            "tabSelesai"
        )
        .classList
        .toggle(
            "active",
            tab === "selesai"
        );


    if(tab === "aktif"){

        document
            .getElementById(
                "tajukSenarai"
            )
            .textContent =
            "Senarai Aduan Aktif";


        document
            .getElementById(
                "notaSejarah"
            )
            .textContent =
            "Aduan yang masih memerlukan tindakan.";

    }


    else{

        document
            .getElementById(
                "tajukSenarai"
            )
            .textContent =
            "Sejarah Aduan Selesai";


        document
            .getElementById(
                "notaSejarah"
            )
            .textContent =
            "Senarai aduan yang telah selesai.";

    }


    paparAduan();

}



/* =====================================================
   PAPAR ADUAN
===================================================== */

function paparAduan(){

    const table =
        document.getElementById(
            "aduanTable"
        );


    const search =
        String(
            document
                .getElementById(
                    "searchInput"
                )
                .value ||
                ""
        )
        .toLowerCase()
        .trim();


    const statusFilter =
        document
            .getElementById(
                "statusFilter"
            )
            .value;


    let data =
        [...semuaAduan];


    /* TAB */

    if(
        tabSemasa ===
        "aktif"
    ){

        data =
            data.filter(
                function(a){

                    return String(
                        a.status ||
                        "Baharu"
                    ).toLowerCase()
                    !==
                    "selesai";

                }
            );

    }


    else{

        data =
            data.filter(
                function(a){

                    return String(
                        a.status ||
                        ""
                    ).toLowerCase()
                    ===
                    "selesai";

                }
            );

    }


    /* SEARCH */

    if(search){

        data =
            data.filter(
                function(a){

                    const teks = [

                        a.noAduan,

                        a.nama,

                        a.lokasi,

                        a.jenis,

                        a.jenisKerosakan,

                        a.bahagian,

                        a.blok,

                        a.tingkat

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                    return teks.includes(
                        search
                    );

                }
            );

    }


    /* FILTER STATUS */

    if(statusFilter){

        data =
            data.filter(
                function(a){

                    return String(
                        a.status ||
                        "Baharu"
                    )
                    ===
                    statusFilter;

                }
            );

    }


    /* SORT */

    data.sort(
        function(a,b){

            return Number(
                b.timestamp || 0
            )
            -
            Number(
                a.timestamp || 0
            );

        }
    );


    /* EMPTY */

    if(data.length === 0){

        table.innerHTML = `

            <tr>

                <td colspan="7">

                    <div class="empty">

                        <div class="empty-icon">
                            📭
                        </div>

                        <strong>
                            Tiada aduan
                        </strong>

                        <p style="margin-top:6px;">
                            Tiada rekod yang sepadan.
                        </p>

                    </div>

                </td>

            </tr>

        `;

        return;

    }


    /* TABLE */

    table.innerHTML =

        data.map(
            function(a){

                const status =
                    a.status ||
                    "Baharu";


                const statusClass =

                    status ===
                    "Selesai"

                    ?

                    "status-selesai"

                    :

                    status ===
                    "Dalam Tindakan"

                    ?

                    "status-tindakan"

                    :

                    "status-baharu";


                return `

                    <tr>

                        <td>

                            <strong>

                                ${
                                    escapeHTML(
                                        a.noAduan ||
                                        "-"
                                    )
                                }

                            </strong>

                        </td>


                        <td>

                            ${
                                escapeHTML(
                                    a.tarikh ||
                                    "-"
                                )
                            }

                            <br>

                            <small
                                style="color:#9ca3af;"
                            >

                                ${
                                    escapeHTML(
                                        a.masa ||
                                        ""
                                    )
                                }

                            </small>

                        </td>


                        <td>

                            ${
                                escapeHTML(
                                    a.nama ||
                                    "-"
                                )
                            }

                        </td>


                        <td>

                            ${
                                escapeHTML(
                                    a.lokasi ||
                                    "-"
                                )
                            }

                        </td>


                        <td>

                            ${
                                escapeHTML(
                                    a.jenis ||
                                    a.jenisKerosakan ||
                                    "-"
                                )
                            }

/* =====================================================
   UPDATE STATUS
===================================================== */

async function kemaskiniStatus(id){

    const aduan =
        semuaAduan.find(
            function(a){

                return String(a.id)
                ===
                String(id);

            }
        );


    if(!aduan){

        alert(
            "Aduan tidak dijumpai."
        );

        return;

    }


    const statusEl =
        document.getElementById(
            "statusBaru"
        );


    const catatanEl =
        document.getElementById(
            "catatanBaru"
        );


    if(!statusEl ||
       !catatanEl){

        alert(
            "Ruangan kemaskini tidak dijumpai."
        );

        return;

    }


    const status =
        statusEl.value;


    const catatan =
        catatanEl.value.trim();


    const button =
        document.querySelector(
            ".update-actions .btn-success"
        );


    if(button){

        button.disabled =
            true;

        button.textContent =
            "⏳ Menyimpan...";

    }


    try{

        await db
            .collection("aduan")
            .doc(
                String(id)
            )
            .update({

                status:
                    status,

                catatan:
                    catatan,

                catatanPPT:
                    catatan,

                tarikhKemaskini:
                    new Date()
                    .toLocaleDateString(
                        "ms-MY"
                    ),

                masaKemaskini:
                    new Date()
                    .toLocaleTimeString(
                        "ms-MY"
                    ),

                timestampKemaskini:
                    firebase
                    .firestore
                    .FieldValue
                    .serverTimestamp()

            });


        tutupModal();


        tunjukToast(
            "✅ Kemaskini aduan berjaya disimpan."
        );


    }

    catch(error){

        console.error(
            error
        );


        alert(
            "❌ Kemaskini gagal disimpan.\n\n" +
            error.message
        );


        if(button){

            button.disabled =
                false;

            button.textContent =
                "💾 Simpan Kemaskini";

        }

    }

}



/* =====================================================

async function janaPDF(id){

    const a =
        semuaAduan.find(
            function(item){

                return String(item.id)
                ===
                String(id);

            }
        );


    if(!a){

        alert(
            "Aduan tidak dijumpai."
        );

        return;

    }


    if(!window.jspdf){

        alert(
            "Library PDF belum dimuatkan."
        );

        return;

    }


    const {
        jsPDF
    } =
        window.jspdf;


    const pdf =
        new jsPDF(
            "p",
            "mm",
            "a4"
        );


    const margin =
        15;


    let y =
        18;


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(
        17
    );


    pdf.text(
        "JABATAN MINERAL DAN GEOSAINS MALAYSIA",
        105,
        y,
        {
            align:"center"
        }
    );


    y += 8;


    pdf.setFontSize(
        13
    );


    pdf.text(
        "SABAH",
        105,
        y,
        {
            align:"center"
        }
    );


    y += 12;


    pdf.setFontSize(
        15
    );


    pdf.text(
        "BORANG ADUAN KEROSAKAN FASILITI",
        105,
        y,
        {
            align:"center"
        }
    );


    y += 12;


    pdf.line(
        margin,
        y,
        195,
        y
    );


    y += 10;


    pdf.setFontSize(
        11
    );


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "NO. ADUAN:",
        margin,
        y
    );


    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.text(
        String(
            a.noAduan ||
            "-"
        ),
        48,
        y
    );


    y += 8;


    const rows = [

        [
            "Tarikh",
            a.tarikh || "-"
        ],

        [
            "Masa",
            a.masa || "-"
        ],

        [
            "Nama Pelapor",
            a.nama || "-"
        ],

        [
            "Jawatan",
            a.jawatan || "-"
        ],

        [
            "Bahagian / Unit",
            a.bahagian || "-"
        ],

        [
            "Blok",
            a.blok || "-"
        ],

        [
            "Tingkat",
            a.tingkat || "-"
        ],

        [
            "Lokasi",
            a.lokasi || "-"
        ],

        [
            "Jenis Kerosakan",
            a.jenis ||
            a.jenisKerosakan ||
            "-"
        ],

        [
            "Status",
            a.status ||
            "Baharu"
        ]

    ];


    pdf.setFontSize(
        10
    );


    for(
        const row of rows
    ){

        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.text(
            row[0] + ":",
            margin,
            y
        );


        pdf.setFont(
            "helvetica",
            "normal"
        );


        const value =
            pdf.splitTextToSize(
                String(row[1]),
                135
            );


        pdf.text(
            value,
            58,
            y
        );


        y += Math.max(
            7,
            value.length * 5
        );

    }



    /* PENERANGAN */

    y += 3;


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "PENERANGAN KEROSAKAN:",
        margin,
        y
    );


    y += 6;


    pdf.setFont(
        "helvetica",
        "normal"
    );


    const penerangan =
        pdf.splitTextToSize(
            String(
                a.penerangan ||
                "-"
            ),
            180
        );


    pdf.text(
        penerangan,
        margin,
        y
    );


    y += Math.max(
        10,
        penerangan.length * 5
    );



    /* CADANGAN */

    y += 3;


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "CADANGAN PELAPOR:",
        margin,
        y
    );


    y += 6;


    pdf.setFont(
        "helvetica",
        "normal"
    );


    const cadangan =
        pdf.splitTextToSize(
            String(
                a.cadangan ||
                "-"
            ),
            180
        );


    pdf.text(
        cadangan,
        margin,
        y
    );


    y += Math.max(
        10,
        cadangan.length * 5
    );



    /* CATATAN PPT */

    y += 3;


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "CATATAN / TINDAKAN PPT:",
        margin,
        y
    );


    y += 6;


    pdf.setFont(
        "helvetica",
        "normal"
    );


    const catatan =
        pdf.splitTextToSize(
            String(
                a.catatan ||
                a.catatanPPT ||
                "-"
            ),
            180
        );


    pdf.text(
        catatan,
        margin,
        y
    );


    y += Math.max(
        10,
        catatan.length * 5
    );



    /* GAMBAR */

    if(a.gambar){

        try{

            if(y > 210){

                pdf.addPage();

                y = 20;

            }


            pdf.setFont(
                "helvetica",
                "bold"
            );


            pdf.text(
                "GAMBAR KEROSAKAN:",
                margin,
                y
            );


            y += 7;


            const imageData =
                await loadImageData(
                    a.gambar
                );


            const props =
                pdf.getImageProperties(
                    imageData
                );


            const maxWidth =
                180;


            const maxHeight =
                85;


            let width =
                maxWidth;


            let height =
                width *
                props.height /
                props.width;


            if(
                height >
                maxHeight
            ){

                height =
                    maxHeight;


                width =
                    height *
                    props.width /
                    props.height;

            }


            pdf.addImage(
                imageData,
                "JPEG",
                margin,
                y,
                width,
                height
            );


        }

        catch(error){

            console.error(
                "Gambar gagal dimasukkan:",
                error
            );

        }

    }



    /* FOOTER */

    const pageHeight =
        pdf.internal
        .pageSize
        .height;


    pdf.setFontSize(
        8
    );


    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.text(
        "Laporan dijana melalui Sistem Aduan Kerosakan Fasiliti JMG Sabah",
        105,
        pageHeight - 10,
        {
            align:"center"
        }
    );


    const namaFail =
        String(
            a.noAduan ||
            "Aduan"
        )
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );


    pdf.save(
        namaFail +
        ".pdf"
    );

}



/* =====================================================
   LOAD IMAGE UNTUK PDF
===================================================== */

function loadImageData(src){

    return new Promise(
        function(resolve,reject){

            const img =
                new Image();


            img.onload =
                function(){

                    const canvas =
                        document
                        .createElement(
                            "canvas"
                        );


                    canvas.width =
                        img.naturalWidth;


                    canvas.height =
                        img.naturalHeight;


                    const ctx =
                        canvas
                        .getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .85
                        )
                    );

                };


            img.onerror =
                reject;


            img.src =
                src;

        }
    );

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =====================================================
   ESCAPE JAVASCRIPT ID
===================================================== */

function escapeJS(value){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}
