<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal PPT - Sistem Aduan JMG Sabah</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#1f2937;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#123c69,#1769aa);
    color:white;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.header-left h1{
    font-size:25px;
    margin-bottom:5px;
}

.header-left p{
    font-size:14px;
    opacity:.9;
}

.header-right{
    text-align:right;
}

.header-right .role{
    font-weight:bold;
    font-size:14px;
}

.header-right .date{
    font-size:12px;
    margin-top:4px;
    opacity:.8;
}

/* CONTAINER */
.container{
    width:95%;
    max-width:1450px;
    margin:25px auto;
}

/* DASHBOARD */
.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:14px;
    padding:22px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    display:flex;
    align-items:center;
    gap:18px;
}

.card-icon{
    width:58px;
    height:58px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    background:#e8f1fb;
}

.card-info h3{
    font-size:30px;
    margin-bottom:3px;
}

.card-info p{
    color:#6b7280;
    font-size:13px;
}

/* TOOLBAR */
.toolbar{
    background:white;
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.tab{
    border:none;
    padding:11px 20px;
    border-radius:8px;
    background:#eef2f7;
    color:#374151;
    cursor:pointer;
    font-weight:bold;
}

.tab.active{
    background:#1769aa;
    color:white;
}

.filters{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:240px;
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
}

.select{
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    background:white;
}

/* TABLE */
.table-container{
    background:white;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    overflow:hidden;
}

.table-header{
    padding:20px;
    border-bottom:1px solid #e5e7eb;
}

.table-header h2{
    font-size:19px;
}

.table-header p{
    margin-top:5px;
    color:#6b7280;
    font-size:13px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

thead{
    background:#f8fafc;
}

th{
    text-align:left;
    padding:14px 16px;
    font-size:12px;
    color:#4b5563;
    text-transform:uppercase;
}

td{
    padding:15px 16px;
    border-top:1px solid #eef0f3;
    font-size:13px;
    vertical-align:middle;
}

tbody tr:hover{
    background:#f9fbfd;
}

/* STATUS */
.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.status-baharu{
    background:#e8f1ff;
    color:#1769aa;
}

.status-tindakan{
    background:#fff4d6;
    color:#a16207;
}

.status-selesai{
    background:#dcfce7;
    color:#15803d;
}

/* BUTTON */
.btn{
    border:none;
    border-radius:7px;
    padding:8px 13px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}

.btn-primary{
    background:#1769aa;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-secondary{
    background:#6b7280;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn:hover{
    opacity:.88;
}

/* EMPTY */
.empty{
    padding:55px 20px;
    text-align:center;
    color:#6b7280;
}

.empty-icon{
    font-size:50px;
    margin-bottom:15px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:9999;
    padding:25px;
    overflow-y:auto;
}

.modal.show{
    display:block;
}

.modal-box{
    width:100%;
    max-width:950px;
    margin:20px auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.modal-header{
    background:#123c69;
    color:white;
    padding:18px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    font-size:19px;
}

.close{
    border:none;
    background:transparent;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.modal-body{
    padding:24px;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.detail-item{
    background:#f8fafc;
    border-radius:9px;
    padding:13px;
}

.detail-item.full{
    grid-column:1/-1;
}

.detail-label{
    color:#6b7280;
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:5px;
    font-weight:bold;
}

.detail-value{
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}

.image-box{
    margin-top:20px;
    background:#f8fafc;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.image-box img{
    max-width:100%;
    max-height:500px;
    border-radius:8px;
    object-fit:contain;
}

.no-image{
    padding:35px;
    color:#9ca3af;
}

.update-box{
    margin-top:20px;
    border-top:1px solid #e5e7eb;
    padding-top:20px;
}

.update-box h3{
    margin-bottom:15px;
    font-size:16px;
}

.update-grid{
    display:grid;
    grid-template-columns:1fr 2fr;
    gap:12px;
}

.update-grid select,
.update-grid textarea{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-family:inherit;
}

.update-grid textarea{
    min-height:100px;
    resize:vertical;
}

.update-actions{
    margin-top:15px;
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

/* TOAST */
.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#111827;
    color:white;
    padding:14px 20px;
    border-radius:9px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    display:none;
    z-index:10000;
    font-size:13px;
}

.toast.show{
    display:block;
}

/* RESPONSIVE */
@media(max-width:800px){
    .dashboard{
        grid-template-columns:1fr;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .update-grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .header-right{
        text-align:left;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-left">
        <h1>Portal PPT</h1>
        <p>Sistem Aduan Kerosakan Fasiliti JMG Sabah</p>
    </div>

    <div class="header-right">
        <div class="role">Pegawai / PPT</div>
        <div class="date" id="tarikhSemasa"></div>
    </div>
</header>


<main class="container">

    <!-- DASHBOARD -->
    <section class="dashboard">

        <div class="card">
            <div class="card-icon">📋</div>
            <div class="card-info">
                <h3 id="jumlahAduan">0</h3>
                <p>Jumlah Aduan Aktif</p>
            </div>
        </div>

        <div class="card">
            <div class="card-icon">🔧</div>
            <div class="card-info">
                <h3 id="dalamTindakan">0</h3>
                <p>Dalam Tindakan</p>
            </div>
        </div>

        <div class="card">
            <div class="card-icon">✅</div>
            <div class="card-info">
                <h3 id="aduanSelesai">0</h3>
                <p>Aduan Selesai</p>
            </div>
        </div>

    </section>


    <!-- TOOLBAR -->
    <section class="toolbar">

        <div class="tabs">
            <button class="tab active" id="tabAktif" onclick="tukarTab('aktif')">
                Aduan Aktif
            </button>

            <button class="tab" id="tabSelesai" onclick="tukarTab('selesai')">
                Aduan Selesai
            </button>
        </div>

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                class="search"
                placeholder="🔎 Cari no aduan, nama atau lokasi..."
            >

            <select id="statusFilter" class="select">
                <option value="">Semua Status</option>
                <option value="Baharu">Baharu</option>
                <option value="Dalam Tindakan">Dalam Tindakan</option>
                <option value="Selesai">Selesai</option>
            </select>

        </div>

    </section>


    <!-- TABLE -->
    <section class="table-container">

        <div class="table-header">
            <h2 id="tajukSenarai">Senarai Aduan Aktif</h2>
            <p id="notaSejarah">Aduan yang masih memerlukan tindakan.</p>
        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>No. Aduan</th>
                        <th>Tarikh</th>
                        <th>Pelapor</th>
                        <th>Lokasi</th>
                        <th>Jenis Kerosakan</th>
                        <th>Status</th>
                        <th>Tindakan</th>
                    </tr>
                </thead>

                <tbody id="aduanTable"></tbody>

            </table>

        </div>

    </section>

</main>


<!-- MODAL DETAIL -->
<div class="modal" id="detailModal">

    <div class="modal-box">

        <div class="modal-header">
            <h2>Butiran Aduan</h2>
            <button class="close" onclick="tutupModal()">×</button>
        </div>

        <div class="modal-body" id="detailContent"></div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

const STORAGE_KEY = "JMG_ADUAN_SABAH";

let semuaAduan = [];
let tabSemasa = "aktif";
let aduanSemasa = null;


/* =========================================================
   TARIKH
========================================================= */

function paparkanTarikh(){

    const sekarang = new Date();

    const pilihan = {
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    };

    document.getElementById("tarikhSemasa").textContent =
        sekarang.toLocaleString("ms-MY", pilihan);
}


/* =========================================================
   AMBIL DATA LOCAL STORAGE
========================================================= */

function dapatkanAduan(){

    try{

        const data = localStorage.getItem(STORAGE_KEY);

        if(!data){
            semuaAduan = [];
        }else{

            const parsed = JSON.parse(data);

            if(Array.isArray(parsed)){
                semuaAduan = parsed;
            }else{
                semuaAduan = [];
            }
        }

        /*
         * Pastikan setiap aduan ada ID.
         */
        semuaAduan = semuaAduan.map((aduan,index)=>{

            if(!aduan.id){
                aduan.id =
                    aduan.timestamp ||
                    Date.now() + index;
            }

            /*
             * Sokong nama field lama / baru.
             */
            if(!aduan.jenis && aduan.jenisKerosakan){
                aduan.jenis = aduan.jenisKerosakan;
            }

            if(!aduan.catatan && aduan.catatanPPT){
                aduan.catatan = aduan.catatanPPT;
            }

            if(!aduan.status){
                aduan.status = "Baharu";
            }

            return aduan;

        });

        kemaskiniDashboard();
        paparAduan();

    }catch(error){

        console.error("Ralat localStorage:",error);

        semuaAduan = [];

        kemaskiniDashboard();
        paparAduan();
    }
}


/* =========================================================
   SIMPAN DATA
========================================================= */

function simpanAduan(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(semuaAduan)
        );

        return true;

    }catch(error){

        console.error(error);

        alert(
            "Data tidak dapat disimpan. " +
            "Kemungkinan ruang storan browser sudah penuh."
        );

        return false;
    }
}


/* =========================================================
   DASHBOARD
========================================================= */

function kemaskiniDashboard(){

    const jumlahAktif = semuaAduan.filter(a =>
        String(a.status || "Baharu").toLowerCase() !== "selesai"
    ).length;

    const tindakan = semuaAduan.filter(a =>
        String(a.status || "").toLowerCase() ===
        "dalam tindakan"
    ).length;

    const selesai = semuaAduan.filter(a =>
        String(a.status || "").toLowerCase() ===
        "selesai"
    ).length;


    document.getElementById("jumlahAduan").textContent =
        jumlahAktif;

    document.getElementById("dalamTindakan").textContent =
        tindakan;

    document.getElementById("aduanSelesai").textContent =
        selesai;
}


/* =========================================================
   TAB
========================================================= */

function tukarTab(tab){

    tabSemasa = tab;

    document
        .getElementById("tabAktif")
        .classList
        .toggle("active", tab === "aktif");

    document
        .getElementById("tabSelesai")
        .classList
        .toggle("active", tab === "selesai");


    if(tab === "aktif"){

        document.getElementById("tajukSenarai").textContent =
            "Senarai Aduan Aktif";

        document.getElementById("notaSejarah").textContent =
            "Aduan yang masih memerlukan tindakan.";

    }else{

        document.getElementById("tajukSenarai").textContent =
            "Sejarah Aduan Selesai";

        document.getElementById("notaSejarah").textContent =
            "Senarai aduan yang telah selesai.";

    }

    paparAduan();
}


/* =========================================================
   PAPAR ADUAN
========================================================= */

function paparAduan(){

    const table =
        document.getElementById("aduanTable");

    const search =
        String(
            document.getElementById("searchInput").value || ""
        ).toLowerCase().trim();

    const statusFilter =
        document.getElementById("statusFilter").value;


    let data = [...semuaAduan];


    /*
     * Filter tab
     */

    if(tabSemasa === "aktif"){

        data = data.filter(a =>
            String(a.status || "Baharu").toLowerCase() !==
            "selesai"
        );

    }else{

        data = data.filter(a =>
            String(a.status || "").toLowerCase() ===
            "selesai"
        );
    }


    /*
     * Search
     */

    if(search){

        data = data.filter(a=>{

            const teks = [

                a.noAduan,
                a.nama,
                a.lokasi,
                a.jenis,
                a.jenisKerosakan,
                a.bahagian,
                a.blok,
                a.tingkat

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

            return teks.includes(search);
        });
    }


    /*
     * Filter status
     */

    if(statusFilter){

        data = data.filter(a =>
            String(a.status || "Baharu") ===
            statusFilter
        );
    }


    /*
     * Susun terbaru dahulu
     */

    data.sort((a,b)=>{

        const ta =
            Number(a.timestamp || a.id || 0);

        const tb =
            Number(b.timestamp || b.id || 0);

        return tb-ta;
    });


    if(data.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="7">
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <strong>Tiada aduan</strong>
                        <p style="margin-top:6px;">
                            Tiada rekod yang sepadan.
                        </p>
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML = data.map(a=>{

        const status =
            a.status || "Baharu";

        const statusClass =
            status === "Selesai"
            ? "status-selesai"
            : status === "Dalam Tindakan"
            ? "status-tindakan"
            : "status-baharu";


        return `
            <tr>

                <td>
                    <strong>${escapeHTML(a.noAduan || "-")}</strong>
                </td>

                <td>
                    ${escapeHTML(a.tarikh || "-")}
                    <br>
                    <small style="color:#9ca3af;">
                        ${escapeHTML(a.masa || "")}
                    </small>
                </td>

                <td>
                    ${escapeHTML(a.nama || "-")}
                </td>

                <td>
                    ${escapeHTML(a.lokasi || "-")}
                </td>

                <td>
                    ${escapeHTML(
                        a.jenis ||
                        a.jenisKerosakan ||
                        "-"
                    )}
                </td>

                <td>
                    <span class="status ${statusClass}">
                        ${escapeHTML(status)}
                    </span>
                </td>

                <td>
                    <button
                        class="btn btn-primary"
                        onclick="lihatAduan('${String(a.id)}')"
                    >
                        Lihat
                    </button>
                </td>

            </tr>
        `;

    }).join("");
}


/* =========================================================
   LIHAT ADUAN
========================================================= */

function lihatAduan(id){

    aduanSemasa =
        semuaAduan.find(a =>
            String(a.id) === String(id)
        );


    if(!aduanSemasa){
        alert("Aduan tidak dijumpai.");
        return;
    }


    const a = aduanSemasa;

    const gambar =
        a.gambar || "";


    let gambarHTML = "";

    if(gambar){

        gambarHTML = `
            <div class="image-box">

                <div class="detail-label">
                    GAMBAR KEROSAKAN
                </div>

                <img
                    src="${gambar}"
                    alt="Gambar kerosakan"
                >

            </div>
        `;

    }else{

        gambarHTML = `
            <div class="image-box">

                <div class="no-image">
                    📷<br><br>
                    Tiada gambar dilampirkan
                </div>

            </div>
        `;
    }


    document.getElementById("detailContent").innerHTML = `

        <div class="detail-grid">

            <div class="detail-item">
                <div class="detail-label">
                    No. Aduan
                </div>

                <div class="detail-value">
                    <strong>
                        ${escapeHTML(a.noAduan || "-")}
                    </strong>
                </div>
            </div>


            <div class="detail-item">

                <div class="detail-label">
                    Tarikh & Masa
                </div>

                <div class="detail-value">
                    ${escapeHTML(a.tarikh || "-")}
                    ${a.masa ? " • " + escapeHTML(a.masa) : ""}
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    Nama Pelapor
                </div>

                <div class="detail-value">
                    ${escapeHTML(a.nama || "-")}
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    Jawatan
                </div>

                <div class="detail-value">
                    ${escapeHTML(a.jawatan || "-")}
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    Bahagian / Unit
                </div>

                <div class="detail-value">
                    ${escapeHTML(a.bahagian || "-")}
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    Blok
                </div>

                <div class="detail-value">
                    ${escapeHTML(a.blok || "-")}
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    Tingkat
                </div>

                <div class="detail-value">
                    ${escapeHTML(a.tingkat || "-")}
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    Lokasi
                </div>

                <div class="detail-value">
                    ${escapeHTML(a.lokasi || "-")}
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    Jenis Kerosakan
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        a.jenis ||
                        a.jenisKerosakan ||
                        "-"
                    )}
                </div>

            </div>


            <div class="detail-item">

                <div class="detail-label">
                    Status Semasa
                </div>

                <div class="detail-value">

                    <span class="status ${
                        a.status === "Selesai"
                        ? "status-selesai"
                        : a.status === "Dalam Tindakan"
                        ? "status-tindakan"
                        : "status-baharu"
                    }">

                        ${escapeHTML(
                            a.status || "Baharu"
                        )}

                    </span>

                </div>

            </div>


            <div class="detail-item full">

                <div class="detail-label">
                    Penerangan Kerosakan
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        a.penerangan || "-"
                    ).replace(/\n/g,"<br>")}
                </div>

            </div>


            <div class="detail-item full">

                <div class="detail-label">
                    Cadangan Pelapor
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        a.cadangan || "-"
                    ).replace(/\n/g,"<br>")}
                </div>

            </div>

        </div>


        ${gambarHTML}


        <div class="update-box">

            <h3>
                ⚙️ Kemaskini Aduan
            </h3>

            <div class="update-grid">

                <select id="statusBaru">

                    <option value="Baharu"
                        ${a.status === "Baharu" ? "selected" : ""}>
                        Baharu
                    </option>

                    <option value="Dalam Tindakan"
                        ${a.status === "Dalam Tindakan" ? "selected" : ""}>
                        Dalam Tindakan
                    </option>

                    <option value="Selesai"
                        ${a.status === "Selesai" ? "selected" : ""}>
                        Selesai
                    </option>

                </select>


                <textarea
                    id="catatanBaru"
                    placeholder="Masukkan catatan / tindakan PPT..."
                >${escapeHTML(
                    a.catatan ||
                    a.catatanPPT ||
                    ""
                )}</textarea>

            </div>


            <div class="update-actions">

                <button
                    class="btn btn-secondary"
                    onclick="janaPDF('${String(a.id)}')"
                >
                    📄 Jana PDF
                </button>

                <button
                    class="btn btn-success"
                    onclick="kemaskiniStatus('${String(a.id)}')"
                >
                    💾 Simpan Kemaskini
                </button>

            </div>

        </div>

    `;


    document
        .getElementById("detailModal")
        .classList.add("show");
}


/* =========================================================
   TUTUP MODAL
========================================================= */

function tutupModal(){

    document
        .getElementById("detailModal")
        .classList.remove("show");

    aduanSemasa = null;
}


/* =========================================================
   KEMASKINI STATUS
========================================================= */

function kemaskiniStatus(id){

    const index =
        semuaAduan.findIndex(a =>
            String(a.id) === String(id)
        );


    if(index === -1){

        alert("Aduan tidak dijumpai.");
        return;
    }


    const status =
        document.getElementById("statusBaru").value;

    const catatan =
        document.getElementById("catatanBaru").value.trim();


    semuaAduan[index].status = status;

    semuaAduan[index].catatan = catatan;

    /*
     * Simpan juga nama field yang digunakan
     * oleh versi lama.
     */
    semuaAduan[index].catatanPPT = catatan;

    semuaAduan[index].tarikhKemaskini =
        new Date().toLocaleDateString("ms-MY");

    semuaAduan[index].masaKemaskini =
        new Date().toLocaleTimeString("ms-MY");


    if(!simpanAduan()){
        return;
    }


    kemaskiniDashboard();

    paparAduan();

    tutupModal();

    tunjukToast(
        "Kemaskini aduan berjaya disimpan."
    );
}


/* =========================================================
   JANA PDF
========================================================= */

async function janaPDF(id){

    const a =
        semuaAduan.find(item =>
            String(item.id) === String(id)
        );


    if(!a){

        alert("Aduan tidak dijumpai.");
        return;
    }


    if(!window.jspdf){

        alert(
            "Library PDF belum dimuatkan. " +
            "Sila semak sambungan internet."
        );

        return;
    }


    const { jsPDF } = window.jspdf;

    const pdf =
        new jsPDF("p","mm","a4");


    const margin = 15;

    let y = 18;


    /* TAJUK */

    pdf.setFont("helvetica","bold");
    pdf.setFontSize(17);

    pdf.text(
        "JABATAN MINERAL DAN GEOSAINS MALAYSIA",
        105,
        y,
        {align:"center"}
    );

    y += 8;


    pdf.setFontSize(13);

    pdf.text(
        "SABAH",
        105,
        y,
        {align:"center"}
    );

    y += 12;


    pdf.setFontSize(15);

    pdf.text(
        "BORANG ADUAN KEROSAKAN FASILITI",
        105,
        y,
        {align:"center"}
    );

    y += 12;


    /* GARIS */

    pdf.setLineWidth(.5);

    pdf.line(
        margin,
        y,
        195,
        y
    );

    y += 10;


    /* NO ADUAN */

    pdf.setFont("helvetica","bold");
    pdf.setFontSize(11);

    pdf.text(
        "NO. ADUAN:",
        margin,
        y
    );

    pdf.setFont("helvetica","normal");

    pdf.text(
        String(a.noAduan || "-"),
        48,
        y
    );

    y += 8;


    /* MAKLUMAT */

    const rows = [

        ["Tarikh", a.tarikh || "-"],

        ["Masa", a.masa || "-"],

        ["Nama Pelapor", a.nama || "-"],

        ["Jawatan", a.jawatan || "-"],

        ["Bahagian / Unit", a.bahagian || "-"],

        ["Blok", a.blok || "-"],

        ["Tingkat", a.tingkat || "-"],

        ["Lokasi", a.lokasi || "-"],

        [
            "Jenis Kerosakan",
            a.jenis || a.jenisKerosakan || "-"
        ],

        ["Status", a.status || "Baharu"]

    ];


    pdf.setFontSize(10);


    for(const row of rows){

        pdf.setFont("helvetica","bold");

        pdf.text(
            row[0] + ":",
            margin,
            y
        );

        pdf.setFont("helvetica","normal");

        const value =
            pdf.splitTextToSize(
                String(row[1]),
                135
            );

        pdf.text(
            value,
            58,
            y
        );

        y +=
            Math.max(
                7,
                value.length * 5
            );
    }


    /* PENERANGAN */

    y += 3;

    pdf.setFont("helvetica","bold");

    pdf.text(
        "PENERANGAN KEROSAKAN:",
        margin,
        y
    );

    y += 6;

    pdf.setFont("helvetica","normal");

    const penerangan =
        pdf.splitTextToSize(
            String(a.penerangan || "-"),
            180
        );

    pdf.text(
        penerangan,
        margin,
        y
    );

    y +=
        Math.max(
            10,
            penerangan.length * 5
        );


    /* CADANGAN */

    y += 3;

    pdf.setFont("helvetica","bold");

    pdf.text(
        "CADANGAN PELAPOR:",
        margin,
        y
    );

    y += 6;

    pdf.setFont("helvetica","normal");

    const cadangan =
        pdf.splitTextToSize(
            String(a.cadangan || "-"),
            180
        );

    pdf.text(
        cadangan,
        margin,
        y
    );

    y +=
        Math.max(
            10,
            cadangan.length * 5
        );


    /* CATATAN PPT */

    y += 3;

    pdf.setFont("helvetica","bold");

    pdf.text(
        "CATATAN / TINDAKAN PPT:",
        margin,
        y
    );

    y += 6;

    pdf.setFont("helvetica","normal");

    const catatan =
        pdf.splitTextToSize(
            String(
                a.catatan ||
                a.catatanPPT ||
                "-"
            ),
            180
        );

    pdf.text(
        catatan,
        margin,
        y
    );

    y +=
        Math.max(
            10,
            catatan.length * 5
        );


    /* GAMBAR */

    if(a.gambar){

        try{

            if(y > 210){

                pdf.addPage();

                y = 20;
            }


            pdf.setFont("helvetica","bold");

            pdf.text(
                "GAMBAR KEROSAKAN:",
                margin,
                y
            );

            y += 7;


            const imageData =
                await loadImageData(a.gambar);


            const props =
                pdf.getImageProperties(imageData);


            const maxWidth = 180;

            const maxHeight = 85;


            let width = maxWidth;

            let height =
                width *
                props.height /
                props.width;


            if(height > maxHeight){

                height = maxHeight;

                width =
                    height *
                    props.width /
                    props.height;
            }


            pdf.addImage(
                imageData,
                "JPEG",
                margin,
                y,
                width,
                height
            );


        }catch(error){

            console.error(
                "Gagal masukkan gambar:",
                error
            );
        }
    }


    /* FOOTER */

    const pageHeight =
        pdf.internal.pageSize.height;


    pdf.setFontSize(8);

    pdf.setFont("helvetica","normal");

    pdf.text(
        "Dokumen dijana melalui Sistem Aduan Kerosakan Fasiliti JMG Sabah",
        105,
        pageHeight - 10,
        {align:"center"}
    );


    const namaFail =
        String(
            a.noAduan ||
            "Aduan"
        ).replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );


    pdf.save(
        namaFail + ".pdf"
    );
}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImageData(src){

    return new Promise((resolve,reject)=>{

        const img =
            new Image();

        img.onload = ()=>{

            const canvas =
                document.createElement("canvas");

            canvas.width =
                img.naturalWidth;

            canvas.height =
                img.naturalHeight;


            const ctx =
                canvas.getContext("2d");

            ctx.drawImage(
                img,
                0,
                0
            );


            resolve(
                canvas.toDataURL(
                    "image/jpeg",
                    .85
                )
            );
        };


        img.onerror = reject;

        img.src = src;
    });
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   TOAST
========================================================= */

function tunjukToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");


    setTimeout(()=>{

        toast.classList.remove("show");

    },3000);
}


/* =========================================================
   EVENT LISTENER
========================================================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        paparAduan
    );


document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        paparAduan
    );


/* Klik luar modal */

document
    .getElementById("detailModal")
    .addEventListener(
        "click",
        function(e){

            if(e.target === this){
                tutupModal();
            }

        }
    );


/* =========================================================
   MULA
========================================================= */

paparkanTarikh();

dapatkanAduan();


/*
 * Refresh setiap 2 saat.
 * Sebab aduan.html dan ppt.html menggunakan
 * localStorage yang sama.
 */

setInterval(
    dapatkanAduan,
    2000
);

</script>
